[project]
name = "card-reader"
version = "0.1.0"
requires-python = ">=3.11"
description = "SmartCard reader connection and APDU communication"
dependencies = [
    "pyscard>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_reader"]
