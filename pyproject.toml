[project]
name = "smartcard-master-skills"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "smartcard-skill-sdk",
    "pytest>=8.0",
    "read-iccid-skill",
    "esim-iot-profile-download-skill",
]

[tool.uv.workspace]
members = ["packages/*", "skills/*"]

[tool.uv.sources]
smartcard-skill-sdk = { workspace = true }
read-iccid-skill = { workspace = true }
esim-iot-profile-download-skill = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
