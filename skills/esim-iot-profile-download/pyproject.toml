[project]
name = "esim-iot-profile-download-skill"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "smartcard-skill-sdk",
    "cryptography>=41.0",
    "pyasn1>=0.5",
]

[project.scripts]
esim-iot-profile-download-skill = "esim_iot_profile_download.main:main"

[project.entry-points."smartcard.skills"]
"esim.iot-profile-download" = "esim_iot_profile_download.main:main"

[tool.uv.sources]
smartcard-skill-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esim_iot_profile_download"]
